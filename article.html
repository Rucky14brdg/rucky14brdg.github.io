<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>記事 - 石橋のはたけ</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>

<body>
	<div class="container">
		<header>
			<h1><a class="site-title-link" href="index.html">石橋のはたけ</a></h1>
		</header>

		<main class="article-page">
			<p><a href="index.html">戻る</a></p>
			<article id="markdown-content" class="markdown-content">
				<p>読み込み中</p>
			</article>
		</main>
	</div>

	<script>
		var file = new URLSearchParams(window.location.search).get("file");
		var article = document.getElementById("markdown-content");
		var path = file.indexOf("articles/") === 0 ? file : "articles/" + file;

		fetch(path)
			.then(function (response) {
				return response.text();
			})
			.then(function (text) {
				article.innerHTML = marked.parse(text);
			});
	</script>
</body>

</html>
