<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>記事 - 石橋のはたけ</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>

<body>
	<div class="container">
		<header>
			<h1><a class="site-title-link" href="index.html">石橋のはたけ</a></h1>
		</header>

		<main class="article-page">
			<p><a href="index.html">戻る</a></p>
			<article id="markdown-content" class="markdown-content">
				<p>読み込み中</p>
			</article>
		</main>
	</div>

	<script>
		var params = new URLSearchParams(window.location.search);
		var file = params.get("file");
		var article = document.getElementById("markdown-content");

		if (!file || file.indexOf("/") !== -1 || !file.endsWith(".md")) {
			article.innerHTML = "<p>記事を指定してください。</p>";
		} else {
			fetch("articles/" + file)
				.then(function (response) {
					if (!response.ok) {
						throw new Error("Markdown file not found.");
					}
					return response.text();
				})
				.then(function (text) {
					article.innerHTML = marked.parse(text);

					var heading = article.querySelector("h1");
					if (heading) {
						document.title = heading.textContent + " - 石橋のはたけ";
					}
				})
				.catch(function () {
					article.innerHTML = "<p>記事を読み込めませんでした。</p>";
				});
		}
	</script>
</body>

</html>
