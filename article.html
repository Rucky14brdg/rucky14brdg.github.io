<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>記事 - 石橋のはたけ</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>

<body>
	<div class="container">
		<header>
			<h1><a class="site-title-link" href="index.html">石橋のはたけ</a></h1>
		</header>

		<main class="article-page">
			<p><a href="javascript:history.back();">戻る</a></p>
			<article id="markdown-content" class="markdown-content">
				<p>読み込み中</p>
			</article>
		</main>
	</div>

	<script>
		var file = new URLSearchParams(window.location.search).get("file");
		var article = document.getElementById("markdown-content");

		if (!file) {
			article.innerHTML = "<p>記事が指定されていません。</p>";
		} else {
			var path = file.indexOf("articles/") === 0 ? file : "articles/" + file;

			fetch(path)
				.then(function (response) {
					if (!response.ok) {
						throw new Error("記事の読み込みに失敗しました: " + path);
					}
					return response.text();
				})
				.then(function (text) {
					article.innerHTML = marked.parse(text);

					article.querySelectorAll("a[href$='.md']").forEach(function (link) {
						var href = link.getAttribute("href");
						if (!href || href.startsWith("http") || href.startsWith("mailto:") || href.startsWith("#") || href.startsWith("obsidian:")) {
							return;
						}

						var targetPath = href.startsWith("articles/") ? href : href.replace(/^\.\/?/, "");
						if (!targetPath.startsWith("articles/")) {
							targetPath = "articles/" + targetPath;
						}

						var rewrittenUrl = "article.html?file=" + encodeURIComponent(targetPath);
						link.setAttribute("href", rewrittenUrl);
						link.addEventListener("click", function (event) {
							event.preventDefault();
							window.location.href = rewrittenUrl;
						});
					});
				})
				.catch(function (error) {
					article.innerHTML = "<p>記事を読み込めませんでした。</p>";
					console.error(error);
				});
		}
	</script>
</body>

</html>
